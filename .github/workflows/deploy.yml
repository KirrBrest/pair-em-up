name: Deploy to GitHub Pages

on:
  push:
    branches:
      - pair-em-up
    paths:
      - '**'
      - '!.github/workflows/deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy dist to gh-pages
        run: |
          mkdir -p gh-pages/pair-em-up
          cp -r dist/* gh-pages/pair-em-up/
          cd gh-pages/pair-em-up
          find . -name ".gitignore" -delete
          
      - name: Create root redirect
        run: |
          cd gh-pages
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=/kirrbrest-JSFE2025Q3/pair-em-up/"></head><body><script>window.location.href="/kirrbrest-JSFE2025Q3/pair-em-up/";</script></body></html>' > index.html

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pair-em-up/ index.html
          git diff --staged --quiet || git commit -m "Deploy to GitHub Pages [skip ci]"
          git push origin gh-pages

