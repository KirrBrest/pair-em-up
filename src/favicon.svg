<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" fill="#f5f5dc"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="rgba(173, 216, 230, 0.5)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="64" height="64" fill="url(#grid)"/>
  
  <!-- Red margin line -->
  <line x1="12" y1="0" x2="12" y2="64" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
  
  <!-- Title text "P" -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">P</text>
</svg>

